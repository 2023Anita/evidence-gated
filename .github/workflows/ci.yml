# 插件开发回归测试；不是业务项目的 required evidence-gate。
name: Codex plugin tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create project environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-governance.lock
      - name: Validate source bundle
        run: .venv/bin/python scripts/validate_bundle.py
      - name: Test governance and failure cases
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Run trusted fixture demonstration
        run: .venv/bin/python scripts/demo.py --output "$RUNNER_TEMP/demo-result.json"
