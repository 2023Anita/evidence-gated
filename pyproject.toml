[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-gated-codex"
version = "0.1.0"
description = "Codex-only evidence-gated engineering workflow MVP"
requires-python = ">=3.12"
dependencies = []
license = {text = "MIT"}

[project.scripts]
egw = "workflow.cli:main"

[tool.setuptools]
packages = ["workflow", "verifiers", "verifiers.software"]
include-package-data = true

[tool.setuptools.package-data]
workflow = ["schemas/*.json", "policies/*.json", "policies/allowed_signers"]
