# 业务项目模板：先保护此工作流及治理仓库，再配置 Required Check。
# 必需仓库变量：EGW_GOVERNANCE_REPOSITORY、EGW_GOVERNANCE_SHA（完整提交）。
# 示例不启用 merge queue，不把模板文件存在当作硬门禁已生效。
name: Evidence Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: evidence-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: evidence-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check immutable governance reference
        env:
          GOV_REPO: ${{ vars.EGW_GOVERNANCE_REPOSITORY }}
          GOV_SHA: ${{ vars.EGW_GOVERNANCE_SHA }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", os.environ["GOV_REPO"]), "Missing governance repository"
          assert re.fullmatch(r"[0-9a-f]{40}", os.environ["GOV_SHA"]), "Governance must be a full immutable commit"
          PY

      - name: Checkout trusted governance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.EGW_GOVERNANCE_REPOSITORY }}
          ref: ${{ vars.EGW_GOVERNANCE_SHA }}
          path: governance
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Checkout merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Install fixed trusted dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/egw-venv"
          "$RUNNER_TEMP/egw-venv/bin/python" -m pip install --require-hashes \
            -r "$GITHUB_WORKSPACE/governance/requirements-governance.lock"

      - name: Prepare trusted container image
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          policy = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "governance/workflow/policies/software-python.json"
          image = json.loads(policy.read_text())["container_image"]
          assert re.fullmatch(r"python@sha256:[0-9a-f]{64}", image)
          subprocess.run(["docker", "pull", image], check=True, timeout=180)
          PY

      - name: Verify candidate with trusted code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/egw-evidence"
          "$RUNNER_TEMP/egw-venv/bin/python" -I \
            "$GITHUB_WORKSPACE/governance/scripts/egw.py" verify \
            --ci --root "$GITHUB_WORKSPACE/candidate" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --candidate-sha "$CANDIDATE_SHA" \
            --output "$RUNNER_TEMP/egw-evidence/report.json"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/egw-evidence/
          if-no-files-found: warn
          retention-days: 30
